name: CI / Fuzz

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Go Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.github.com:443
            codeload.github.com:443
            github.com:443
            *.actions.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            github-releases.githubusercontent.com:443
            objects.githubusercontent.com:443
            objects-origin.githubusercontent.com:443
            github-registry-files.githubusercontent.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Run Fuzz Seed Corpus
        run: |
          set -euo pipefail
          go test -count=1 ./...

      - name: Run Bounded Fuzz Targets
        run: |
          set -euo pipefail

          found=false
          while IFS= read -r package_path; do
            mapfile -t fuzz_targets < <(go test "${package_path}" -list '^Fuzz' | grep '^Fuzz' || true)
            if [ "${#fuzz_targets[@]}" -eq 0 ]; then
              continue
            fi

            found=true
            for fuzz_target in "${fuzz_targets[@]}"; do
              echo "Running ${package_path} ${fuzz_target}"
              go test "${package_path}" -run=^$ -fuzz="^${fuzz_target}$" -fuzztime=10s -parallel=2 -timeout=30s
            done
          done < <(go list ./...)

          if [ "${found}" != "true" ]; then
            echo "No Go fuzz targets were found"
            exit 1
          fi
